<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2128"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c8902e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- quota track and the used share (~72%) -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="18"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"
          stroke-dasharray="380 528" transform="rotate(-90 128 128)"/>
  <!-- pyramid: lit face and shaded face -->
  <polygon points="128,78 84,166 128,166" fill="#f3d27a"/>
  <polygon points="128,78 172,166 128,166" fill="#b07a22"/>
  <!-- the horizon line the pyramid sits on -->
  <rect x="74" y="166" width="108" height="8" rx="4" fill="#ffffff" fill-opacity="0.85"/>
</svg>
